  <text x="180" y="2290" fill="#281F18" font-size="42" font-family="Avenir Next, PingFang SC, sans-serif" font-weight="700">C. Orbit Stack</text>
  <text x="180" y="2346" fill="#755F4E" font-size="28" font-family="Avenir Next, PingFang SC, sans-serif">多层卡片 + 焦点轨道，偏产品系统感。</text>

