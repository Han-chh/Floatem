    <image href="./quicknote-logo-concept-b.svg" x="1214" y="434" width="652" height="652"/>
  </g>
  <text x="1120" y="1260" fill="#281F18" font-size="42" font-family="Avenir Next, PingFang SC, sans-serif" font-weight="700">B. Folded Focus</text>
  <text x="1120" y="1316" fill="#755F4E" font-size="28" font-family="Avenir Next, PingFang SC, sans-serif">纸张折角 + 完成圆环，偏效率工具感。</text>

  <g>
    <rect x="196" y="1394" width="840" height="840" rx="72" fill="#D7C6B4" opacity="0.18"/>
    <rect x="180" y="1370" width="840" height="840" rx="72" fill="#FFFAF4"/>
    <image href="./quicknote-logo-concept-c.svg" x="274" y="1464" width="652" height="652"/>
