    <rect x="180" y="340" width="840" height="840" rx="72" fill="#FFFAF4"/>
    <image href="./quicknote-logo-concept-a.svg" x="274" y="434" width="652" height="652"/>
  </g>
  <text x="180" y="1260" fill="#281F18" font-size="42" font-family="Avenir Next, PingFang SC, sans-serif" font-weight="700">A. Velocity Note</text>
  <text x="180" y="1316" fill="#755F4E" font-size="28" font-family="Avenir Next, PingFang SC, sans-serif">折角便签 + 动势笔触，强调“快速记录”。</text>

  <g>
    <rect x="1136" y="364" width="840" height="840" rx="72" fill="#D7C6B4" opacity="0.18"/>
