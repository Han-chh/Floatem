      <stop stop-color="#FFFCF6"/>
      <stop offset="0.56" stop-color="#F4EADB"/>
      <stop offset="1" stop-color="#EBDCCA"/>
    </linearGradient>
  </defs>
  <rect width="2400" height="2500" fill="url(#sheetBg)"/>
  <text x="180" y="200" fill="#2B2018" font-size="84" font-family="Avenir Next, PingFang SC, sans-serif" font-weight="700">QuickNote Logo Explorations</text>
  <text x="180" y="278" fill="#7C6553" font-size="34" font-family="Avenir Next, PingFang SC, sans-serif">Fresh, efficient, design-forward directions aligned to the current QuickNote palette.</text>

  <g>
